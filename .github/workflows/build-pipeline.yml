name: Build production binary

on:
  push:
    branches:
      - prod

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-amd64
            runner: windows-latest

          - platform: linux-amd64
            runner: ubuntu-latest

          - platform: macos-arm64
            runner: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify project structure
        shell: bash
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "Repository files:"
          ls -la

          echo "App files:"
          ls -la app

          echo "Dependency files:"
          find app/dependencies -maxdepth 3 -type f

          if [ ! -f "app/main.py" ]; then
            echo "ERROR: app/main.py was not found"
            exit 1
          fi

          if [ ! -d "app/dependencies" ]; then
            echo "ERROR: app/dependencies was not found"
            exit 1
          fi

      - name: Build application
        uses: espressif/python-binary-action@master
        with:
          # Entry point
          scripts: "app/main.py"

          # Build output
          output-dir: "./dist/${{ matrix.platform }}"

          # Target platform
          target-platform: ${{ matrix.platform }}

          # Install project dependencies and local wheel files.
          install-deps-command: >-
            uv pip install
            -r requirements.txt

          # Include the CameraLibrary package and YAML configuration files.
          include-data-dirs: |
            {
              "*": [
                "./app/dependencies/CameraLibrary"
              ]
            }
      - name: Display build output
        shell: bash
        run: |
          echo "Generated files:"
          find "./dist/${{ matrix.platform }}" -maxdepth 3 -type f

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: camera-service-${{ matrix.platform }}
          path: "./dist/${{ matrix.platform }}"
          if-no-files-found: error
