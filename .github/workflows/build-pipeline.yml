name: Build and Release production binaries

on:
  push:
    branches:
      - prod

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-amd64
            runner: windows-latest

          - platform: linux-amd64
            runner: ubuntu-latest

          - platform: macos-arm64
            runner: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify project structure
        shell: bash
        run: |
          echo "Workspace:"
          pwd

          echo "Repository contents:"
          ls -la

          echo "App contents:"
          ls -la app

          echo "Dependencies:"
          find app/dependencies -maxdepth 3 -type f

          test -f app/main.py
          test -f requirements.txt
          test -d app/dependencies

      - name: Build application
        uses: espressif/python-binary-action@master
        with:
          scripts: "app/main.py"
          output-dir: "./dist/${{ matrix.platform }}"
          target-platform: ${{ matrix.platform }}

          install-deps-command: >-
            uv pip install
            -r requirements.txt

          include-data-dirs: |
            {
              "*": [
                "./app/dependencies"
              ]
            }

      - name: Display build output
        shell: bash
        run: |
          echo "Generated files:"
          find "./dist/${{ matrix.platform }}" -maxdepth 3 -type f

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: camera-service-${{ matrix.platform }}
          path: "./dist/${{ matrix.platform }}"
          if-no-files-found: error

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: Create ZIP files
        shell: bash
        run: |
          mkdir -p release-upload

          for platform_dir in release-files/camera-service-*; do
            platform="${platform_dir#release-files/camera-service-}"

            if [ -d "$platform_dir" ]; then
              (
                cd "$platform_dir"
                zip -r "../../release-upload/camera-service-${platform}.zip" .
              )
            fi
          done

          echo "Release files:"
          ls -lh release-upload

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "prod-${{ github.run_number }}"
          name: "Production build ${{ github.run_number }}"
          generate_release_notes: true
          files: |
            release-upload/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

